<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    MODELO DE CAPA ANIMADA - Grupo Komvos Insights
    Formato 16:9 (viewBox 640x360). Tudo o que anima fica no <style> abaixo: é ele que faz a capa
    continuar animada quando o site mostra o arquivo.

    Regras para a capa funcionar no site:
    1. O CSS precisa estar DENTRO do arquivo (<style> aqui no SVG). CSS em arquivo separado não carrega.
    2. Sem JavaScript, sem fontes externas, sem imagens linkadas: o navegador bloqueia tudo isso em capas.
       Para texto com a fonte certa, converta o texto em contorno (Figma: Outline stroke / Illustrator: Create Outlines)
       ou use poucas palavras com a fonte do sistema, como neste modelo.
    3. Troque a cor de destaque na variável "accent" do <style>: verde Senior #00aa9e, rosa Trusth #af005f, azul Statum #00afef.
    4. Mantenha leve (até ~200 KB) e use transform/opacity/stroke-dashoffset nas animações.
  -->
  <style>
    svg { --accent: #00aa9e; }

    .bg { fill: #121718; }
    .grid { stroke: rgba(147, 149, 152, 0.07); stroke-width: 1; }
    .glow { fill: url(#glow); }

    text { font-family: Montserrat, 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: rgba(244, 247, 251, 0.75); }

    .line { stroke: rgba(147, 149, 152, 0.3); stroke-width: 1; fill: none; }

    .chip rect { fill: #1c2223; stroke: rgba(147, 149, 152, 0.4); animation: chip 2.7s ease-in-out infinite; }

    .flow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-dasharray: 0.12 1;
      stroke-dashoffset: 1.12;
      animation: flow 2.7s ease-in-out infinite;
    }

    .hub rect { fill: #1c2223; stroke: var(--accent); stroke-width: 1.8; }
    .hub text { font-size: 18px; font-weight: 600; fill: #f4f7fb; }

    /* atraso de cada módulo: acendem em sequência */
    .d1 { animation-delay: 0s; }    .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.9s; }
    .d4 { animation-delay: 1.35s; } .d5 { animation-delay: 1.8s; }  .d6 { animation-delay: 2.25s; }
    .chip.d1 rect { animation-delay: 0s; }    .chip.d2 rect { animation-delay: 0.45s; } .chip.d3 rect { animation-delay: 0.9s; }
    .chip.d4 rect { animation-delay: 1.35s; } .chip.d5 rect { animation-delay: 1.8s; }  .chip.d6 rect { animation-delay: 2.25s; }

    @keyframes chip {
      0%, 60%, 100% { stroke: rgba(147, 149, 152, 0.4); }
      20%, 40% { stroke: var(--accent); }
    }

    @keyframes flow {
      0% { stroke-dashoffset: 1.12; opacity: 1; }
      55% { stroke-dashoffset: 0; opacity: 1; }
      56%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* quem pede menos movimento no sistema vê a capa parada */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .flow { opacity: 0; }
    }
  </style>

  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#cdd2d6" stop-opacity="0.1" />
      <stop offset="1" stop-color="#cdd2d6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" class="grid" fill="none" />
    </pattern>
  </defs>

  <!-- fundo: mesmo cinza escuro + grade das capas do site -->
  <rect class="bg" width="640" height="360" />
  <rect width="640" height="360" fill="url(#grid)" />
  <rect class="glow" width="640" height="360" />

  <!-- linhas fixas -->
  <path class="line" d="M320 180 L160 100" />
  <path class="line" d="M320 180 L320 70" />
  <path class="line" d="M320 180 L480 100" />
  <path class="line" d="M320 180 L160 260" />
  <path class="line" d="M320 180 L320 290" />
  <path class="line" d="M320 180 L480 260" />

  <!-- sinal correndo de cada módulo até o centro (pathLength="1" deixa o tracejado em proporção) -->
  <path class="flow d1" pathLength="1" d="M160 100 L320 180" />
  <path class="flow d2" pathLength="1" d="M320 70 L320 180" />
  <path class="flow d3" pathLength="1" d="M480 100 L320 180" />
  <path class="flow d4" pathLength="1" d="M160 260 L320 180" />
  <path class="flow d5" pathLength="1" d="M320 290 L320 180" />
  <path class="flow d6" pathLength="1" d="M480 260 L320 180" />

  <!-- módulos -->
  <g class="chip d1"><rect x="106" y="84" width="108" height="32" rx="8" /><text x="160" y="105" text-anchor="middle">Financeiro</text></g>
  <g class="chip d2"><rect x="266" y="54" width="108" height="32" rx="8" /><text x="320" y="75" text-anchor="middle">Compras</text></g>
  <g class="chip d3"><rect x="426" y="84" width="108" height="32" rx="8" /><text x="480" y="105" text-anchor="middle">Estoque</text></g>
  <g class="chip d4"><rect x="106" y="244" width="108" height="32" rx="8" /><text x="160" y="265" text-anchor="middle">Fiscal</text></g>
  <g class="chip d5"><rect x="266" y="274" width="108" height="32" rx="8" /><text x="320" y="295" text-anchor="middle">Vendas</text></g>
  <g class="chip d6"><rect x="426" y="244" width="108" height="32" rx="8" /><text x="480" y="265" text-anchor="middle">Produção</text></g>

  <!-- centro -->
  <g class="hub">
    <rect x="278" y="150" width="84" height="60" rx="13" />
    <text x="320" y="187" text-anchor="middle">ERP</text>
  </g>
</svg>
